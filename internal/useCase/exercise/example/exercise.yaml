# Приклад завдання для імпорту в каталог (кнопка «Імпорт»). Цей архів імпортується як є і створює робоче опубліковане завдання.
# Для використання слід скопіювати його, змінити значення й запакувати в .zip. Коментар у кінці рядка пояснює ключ: спочатку «обовʼязкове.» або «можна пропустити.»,
# далі зміст, допустимі значення й межі. «Тут потрібне» означає: ключ можна пропустити, але в цьому прикладі на нього посилається інший ключ.
# Необовʼязкові ключі показано з типовими значеннями; рядки, закоментовані на початку («# ключ: …»), показують іншу форму, яка не може стояти поряд із показаною.
#
# Архів: .zip до 512 МіБ; до 1000 записів zip (разом із теками і manifest.json), усі файли після розпакування разом до 512 МіБ;
# файл понад 1 МіБ не може стискатися сильніше ніж 200:1 (такий файл слід пакувати без стиснення, як це робить експорт).
# Експорт перевіряє ті самі межі розміру й кількості записів; більший набір завдань слід експортувати частинами.
# Завдання знаходиться в корені zip або у власній теці; в одному zip може бути декілька тек із завданнями, кожна стане окремим завданням (теки завдань не вкладаються одна в одну).
# У корені теки завдання знаходиться exercise.yaml або exercise.json, не обидва. files/ та images/ лише домовленість: назви тек і вкладеність будь-які.
# Кожен файл теки має бути згаданий у документі (шлях відносно теки завдання, без «..», «\» і «/» на початку): зайвий файл, посилання на відсутній файл і символьне посилання є помилкою.
# Службові файли операційних систем ігноруються в будь-якій теці: __MACOSX/ і .DS_Store (macOS), Thumbs.db і desktop.ini (Windows); зворотна скісна риса в імені запису zip читається як «/». manifest.json (контрольні суми) можна не додавати; якщо він є, а файли змінено вручну, його слід видалити.
# exercise.json містить той самий документ у JSON; коментарі // і /* */ там теж дозволені, а кома після останнього елемента є помилкою.
#
# exercise.yaml чи exercise.json до 4 МіБ; exercise.yaml до 64 рівнів вкладеності. Ключі пишуться точно як тут (малими літерами, snake_case); невідомий ключ є помилкою з його назвою.
# YAML: числа лише звичайні десяткові (10, а не 0x0A, 1e1 чи 1_0); без якорів і посилань (&, *) і без явних тегів (!!str); дату чи час слід брати в лапки;
# логічні значення лише true і false; null означає «не задано»; у файлі один документ. Значення переліків пишуться назвою, малими літерами.
# Ідентифікатори (id) не потрібні: нове завдання імпорт створює сам і сам видає їх варіантам, підзавданням, підказкам і пристроям.
# Ключ id: <UUID> можна дати завданню, версії, варіанту, підзавданню, підказці й пристрою. id завдання (його записує експорт) лише пропонує ціль:
# якщо завдання з таким id існує і доступне для редагування, діалог імпорту пропонує оновити його, інакше створити нове; вибір лишається за автором. id версії ігнорується.
schema: cib-exercise/1  # обовʼязкове. пишеться першим; єдине допустиме значення cib-exercise/1
exercise:  # обовʼязкове. картка завдання в каталозі
  name: Приклад завдання  # обовʼязкове. назва завдання, 3–50 символів без пробілів на краях; якщо назва зайнята, додається « (імпорт N)», а назва скорочується, щоб разом уміститися в 50 символів
  description: Тестове завдання, створене з прикладу формату імпорту.  # можна пропустити. опис для каталогу, звичайний текст до 2000 символів
  tags: [приклад, web]  # можна пропустити. до 20 тегів, кожен непорожній і до 30 байтів (кирилична літера займає 2 байти); зберігаються малими літерами, повтори відкидаються
versions:  # обовʼязкове. версії завдання, щонайменше одна; не більше однієї draft і однієї published
  - status: published  # обовʼязкове. draft | published | unpublished | checkpoint; лише published перевіряється повністю, як під час публікації (зміст, пресети ресурсів і підвищення)
    # exercise: {name: Приклад завдання, description: …, tags: [приклад, web]}  — картка саме цієї версії: ті самі ключі, що в exercise з кореня (name обовʼязкове). Її записує експорт для кожної версії, тож історичні версії зберігають свої назви. Без ключа версія бере exercise з кореня; якщо картку має кожна версія, exercise у корені можна пропустити. Нове завдання отримує картку опублікованої версії, а якщо такої немає — чернетки (інакше першої версії списку)
    admin_note: Перша опублікована версія.  # можна пропустити. нотатка для адміністраторів, під час розвʼязання не показується
    label: ""  # можна пропустити. назва знімка лише для checkpoint (до 500 символів, довше обрізається); для інших статусів ігнорується; типово порожня
    variants:  # обовʼязкове. варіанти версії, для published щонайменше один; видається один із них
      - index: 1  # можна пропустити. номер варіанта для адміністраторів, ціле число; типово 0
        note: Основний варіант.  # можна пропустити. нотатка до варіанта, під час розвʼязання не показується
        weight: 2  # можна пропустити. як часто варіант видається відносно інших: 2 — удвічі частіше, ніж 1; ціле 0–100, 0 і відсутній ключ означають 1; типово 1. Видача детермінована: наступним іде варіант із найменшим відношенням «уже видано ÷ вага», за рівності — перший у списку. Тут варіант 1 має вагу 2, а повʼязаний варіант 2 без ключа weight — вагу 1, тож видача йде в порядку 1, 2, 1, 1, 2, 1, …
        tasks:  # можна пропустити. підзавдання варіанта, у всіх варіантах версії однакові за кількістю й порядком; тут потрібне, бо повʼязаний варіант нижче має одне підзавдання
          - name: Знайди прапор  # обовʼязкове. назва підзавдання, 3–50 символів без пробілів на краях
            description: |  # обовʼязкове. текст підзавдання; порожній рядок починає абзац, перенесення рядка розриває рядок, {{key}} підставляє заповнювач key цього підзавдання (невідомий key є помилкою), \{{ дає буквальні {{
              На сервері {{server}} працює вебсайт.

              Знайди на ньому прапор і здай його.
            difficulty: easy  # обовʼязкове. elementary | trivial | easy | medium | hard | insane; однакова в усіх варіантах
            flag: ["ICE{example_flag}"]  # обовʼязкове. список значень ICE{...}: усередині щонайменше один символ, без пробілів, керувальних символів, { і }; значення не повторюються. Без linked_device рівно одне значення; з linked_device можна кілька (учасник отримає одне), шаблон template:ICE{...} або пропустити ключ (прапор згенерується). У YAML значення з « #» (пробіл перед #) беріть у лапки, інакше решта рядка стане коментарем

            # linked_device_id: <UUID пристрою>  — замість linked_device, коли пристрій має id; id має перевагу над іменем
            linked_device: ""  # можна пропустити. імʼя пристрою цього варіанта, якому прапор передається у змінній середовища device_flag_var; на пристрій посилаються за іменем, і воно має належати рівно одному пристрою варіанта; типово порожнє
            device_flag_var: ""  # можна пропустити. імʼя змінної середовища з прапором; обовʼязкове разом із linked_device, не збігається з env_vars пристрою чи змінною іншого підзавдання того самого пристрою; типово порожнє
            attachments:  # можна пропустити. файли для учасників; тут потрібне, бо інакше files/notes.txt ні з чим не повʼязаний
              - file: files/notes.txt  # обовʼязкове. шлях до файлу відносно теки завдання; однаковий вміст зберігається один раз
                name: notes.txt  # можна пропустити. імʼя файлу, яке бачать учасники, до 255 символів, без /, \ і керувальних символів; типово імʼя самого файлу
            placeholders:  # можна пропустити. заповнювачі для {{key}} в описі, перевіряються за топологією варіанта; тут потрібне, бо опис згадує {{server}}
              - key: server  # можна пропустити. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні; без нього імпорт видає випадкове імʼя; тут потрібне, бо опис згадує {{server}}
                kind: ip  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
                ip_reference: vpn  # обовʼязкове. для kind ip одне з vpn | internet | static; мережа vpn чи internet має бути увімкнена
                octets_1to3: ""  # можна пропустити. для ip_reference static перші три октети адреси (наприклад 10.0.0), разом з last_octet дають IPv4; типово порожнє
                last_octet: 10  # можна пропустити. останній октет адреси, 0–255; типово 0
                show_mask: false  # можна пропустити. true | false, показати маску мережі після адреси; не разом з as_link; типово false
                as_link: false  # можна пропустити. true | false, показати адресу посиланням scheme://адреса[:port][path]; типово false
                scheme: ""  # можна пропустити. лише з as_link, тоді обовʼязкове: http | https; типово порожнє
                port: 0  # можна пропустити. лише з as_link: 0–65535, 0 означає типовий порт схеми; типово 0
                path: ""  # можна пропустити. лише з as_link: починається з /, до 200 байтів, без пробілів, лапок, `, <, > і \; типово порожнє
                device_name: ""  # можна пропустити. для kind external.link імʼя пристрою з external; типово порожнє
            hints:  # можна пропустити. підказки, які можна відкрити, до 10; кількість і рівні однакові в усіх варіантах
              - text: Подивись вихідний код головної сторінки.  # обовʼязкове. текст підказки, непорожній, до 20000 байтів
                level: nudge  # можна пропустити. наскільки підказка допомагає, nudge | direction | steps | near_solution; типово nudge
          - name: Секрет у контейнері  # обовʼязкове. назва підзавдання, 3–50 символів без пробілів на краях
            description: |  # обовʼязкове. текст підзавдання; порожній рядок починає абзац, перенесення рядка розриває рядок, {{key}} підставляє заповнювач key цього підзавдання (невідомий key є помилкою), \{{ дає буквальні {{
              Відкрий вебсервіс за посиланням {{web_proxy}} і знайди приховане значення.

              Сервер бази даних: {{db}}; його адреса без посилання: {{db_plain}}; мережа VPN: {{vpn_net}}; вихід у світ: {{inet_net}}.
            difficulty: medium  # обовʼязкове. elementary | trivial | easy | medium | hard | insane; однакова в усіх варіантах
            flag: ['ICE{fixed_flag_for_device}', 'template:ICE{\d\d[A-C]}']  # можна пропустити. список значень: тут заданий і шаблон template:ICE{...} (видається одне, бо є linked_device); без ключа прапор генерується випадково й передається пристрою; значення не повторюються
            linked_device: web  # можна пропустити. імʼя пристрою цього варіанта, якому прапор передається у змінній середовища device_flag_var; на пристрій посилаються за іменем, і воно має належати рівно одному пристрою варіанта; типово порожнє; тут потрібне, бо шаблон і декілька значень прапора можливі лише з linked_device
            device_flag_var: FLAG  # можна пропустити. імʼя змінної середовища з прапором; обовʼязкове разом із linked_device, не збігається з env_vars пристрою чи змінною іншого підзавдання того самого пристрою; типово порожнє; тут потрібне, бо linked_device вимагає імʼя змінної
            placeholders:  # можна пропустити. заповнювачі для {{key}} в описі, перевіряються за топологією варіанта; тут потрібне, бо опис згадує {{server}}
              - key: web_proxy  # можна пропустити. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні; без нього імпорт видає випадкове імʼя; тут потрібне, бо опис згадує {{server}}
                kind: external.link  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
                device_name: web  # можна пропустити. для kind external.link імʼя пристрою з external; типово порожнє; тут потрібне, бо external.link вказує на пристрій
              - key: db  # можна пропустити. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні; без нього імпорт видає випадкове імʼя; тут потрібне, бо опис згадує {{server}}
                kind: ip  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
                ip_reference: vpn  # обовʼязкове. для kind ip одне з vpn | internet | static; мережа vpn чи internet має бути увімкнена
                last_octet: 20  # можна пропустити. останній октет адреси, 0–255; типово 0
                as_link: true  # можна пропустити. true | false, показати адресу посиланням scheme://адреса[:port][path]; типово false; тут потрібне, бо scheme, port і path діють лише з as_link
                scheme: http  # можна пропустити. лише з as_link, тоді обовʼязкове: http | https; типово порожнє; тут потрібне, бо as_link вимагає схему
                port: 8080  # можна пропустити. лише з as_link: 0–65535, 0 означає типовий порт схеми; типово 0
                path: /status  # можна пропустити. лише з as_link: починається з /, до 200 байтів, без пробілів, лапок, `, <, > і \; типово порожнє
              - key: db_plain  # можна пропустити. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні; без нього імпорт видає випадкове імʼя; тут потрібне, бо опис згадує {{server}}
                kind: ip  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
                ip_reference: static  # обовʼязкове. для kind ip одне з vpn | internet | static; мережа vpn чи internet має бути увімкнена
                octets_1to3: 10.0.0  # можна пропустити. для ip_reference static перші три октети адреси (наприклад 10.0.0), разом з last_octet дають IPv4; типово порожнє; тут потрібне, бо ip_reference static вимагає октети
                last_octet: 5  # можна пропустити. останній октет адреси, 0–255; типово 0
                show_mask: true  # можна пропустити. true | false, показати маску мережі після адреси; не разом з as_link; типово false
              - key: vpn_net  # можна пропустити. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні; без нього імпорт видає випадкове імʼя; тут потрібне, бо опис згадує {{server}}
                kind: vpn.subnet  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
              - key: inet_net  # можна пропустити. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні; без нього імпорт видає випадкове імʼя; тут потрібне, бо опис згадує {{server}}
                kind: internet.subnet  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
            hints:  # можна пропустити. підказки, які можна відкрити, до 10; кількість і рівні однакові в усіх варіантах
              - text: Подивись, які змінні середовища бачить сервіс.  # обовʼязкове. текст підказки, непорожній, до 20000 байтів
                level: nudge  # можна пропустити. наскільки підказка допомагає, nudge | direction | steps | near_solution; типово nudge
              - text: Прапор знаходиться не у файлах сайту, а десь у середовищі процесу.  # обовʼязкове. текст підказки, непорожній, до 20000 байтів
                level: direction  # можна пропустити. наскільки підказка допомагає, nudge | direction | steps | near_solution; типово nudge
              - text: Знайди сторінку, яка виводить діагностику, і прочитай з неї змінні.  # обовʼязкове. текст підказки, непорожній, до 20000 байтів
                level: steps  # можна пропустити. наскільки підказка допомагає, nudge | direction | steps | near_solution; типово nudge
              - text: Відкрий /debug і знайди змінну FLAG.  # обовʼязкове. текст підказки, непорожній, до 20000 байтів
                level: near_solution  # можна пропустити. наскільки підказка допомагає, nudge | direction | steps | near_solution; типово nudge
