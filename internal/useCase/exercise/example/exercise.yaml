# Приклад завдання для імпорту в каталог (кнопка «Імпорт»). Цей архів імпортується як є і створює робоче опубліковане завдання.
# Скопіюйте його, змініть значення і запакуйте в .zip. Коментар у кінці рядка пояснює ключ: спочатку «обовʼязкове.» або «можна пропустити.»,
# далі зміст, допустимі значення й межі. «Тут потрібне» означає: ключ можна пропустити, але в цьому прикладі на нього посилається інший ключ.
#
# Архів: .zip до 128 МіБ; до 1000 файлів, кожен до 64 МіБ після розпакування, усі разом до 256 МіБ.
# Завдання лежить у корені zip або у власній теці; в одному zip може бути кілька тек із завданнями, кожна стане окремим завданням (теки завдань не вкладаються одна в одну).
# У корені теки завдання лежить exercise.yaml або exercise.json, не обидва. files/ та images/ лише домовленість: назви тек і вкладеність будь-які.
# Кожен файл теки має бути згаданий у документі (шлях відносно теки завдання, без «..», «\» і «/» на початку): зайвий файл, посилання на відсутній файл і символьне посилання є помилкою.
# __MACOSX/ і .DS_Store ігноруються. manifest.json (контрольні суми) можна не додавати; якщо він є, а файли змінено вручну, видаліть його.
# exercise.json містить той самий документ у JSON; коментарі // і /* */ там теж дозволені, а кома після останнього елемента є помилкою.
#
# exercise.yaml до 4 МіБ і до 64 рівнів вкладеності. Ключі пишуться точно як тут (малими літерами, snake_case); невідомий ключ є помилкою з його назвою.
# YAML: числа лише звичайні десяткові (10, а не 0x0A, 1e1 чи 1_0); без якорів і посилань (&, *) і без явних тегів (!!str); дату чи час беріть у лапки;
# логічні значення лише true і false; у файлі один документ. Значення переліків пишуться назвою, малими літерами.
# Ідентифікатори (id) не потрібні: імпорт завжди створює нове завдання і сам видає їх варіантам, підзавданням, підказкам і пристроям.
schema: cib-exercise/1  # обовʼязкове. перший ключ документа; єдине допустиме значення cib-exercise/1
exercise:  # обовʼязкове. картка завдання в каталозі
  name: Приклад завдання  # обовʼязкове. назва завдання, 3–50 символів без пробілів на краях; якщо назва зайнята, додається « (імпорт N)»
  description: Тестове завдання, створене з прикладу формату імпорту.  # можна пропустити. опис для каталогу, звичайний текст до 2000 символів
  tags: [приклад, web]  # можна пропустити. до 20 тегів, кожен непорожній і до 30 байтів (кирилична літера займає 2 байти); зберігаються малими літерами, повтори відкидаються
versions:  # обовʼязкове. версії завдання, щонайменше одна; не більше однієї draft і однієї published
  - status: published  # обовʼязкове. draft | published | unpublished | checkpoint; лише published перевіряється повністю, як під час публікації
    admin_note: Перша опублікована версія.  # можна пропустити. нотатка для адміністраторів, учасники її не бачать
    label: ""  # можна пропустити. назва знімка лише для checkpoint (до 500 символів, довше обрізається); для інших статусів ігнорується; типово порожня
    variants:  # обовʼязкове. варіанти версії, для published щонайменше один; учасник отримує один із них
      - index: 1  # можна пропустити. номер варіанта для адміністраторів, ціле число; типово 0
        note: Основний варіант.  # можна пропустити. нотатка до варіанта, учасники її не бачать
        tasks:  # можна пропустити. підзавдання варіанта, у всіх варіантах версії однакові за кількістю й порядком; тут потрібне, бо повʼязаний варіант нижче має одне підзавдання
          - name: Знайди прапор  # обовʼязкове. назва підзавдання, 3–50 символів без пробілів на краях
            description: |  # обовʼязкове. текст для учасників; порожній рядок починає абзац, перенос рядка розриває рядок, {{key}} підставляє заповнювач key цього підзавдання (невідомий key є помилкою), \{{ дає буквальні {{
              На сервері {{server}} працює вебсайт.

              Знайди на ньому прапор і здай його.
            difficulty: easy  # обовʼязкове. elementary | trivial | easy | medium | hard | insane; однакова в усіх варіантах
            flag: ["ICE{example_flag}"]  # обовʼязкове. список значень ICE{...}: усередині щонайменше один символ, без пробілів, керівних символів, { і }; значення не повторюються. Без linked_device рівно одне значення; з linked_device можна кілька (учасник отримає одне), шаблон template:ICE{...} або пропустити ключ (прапор згенерується). У YAML значення з « #» (пробіл перед #) беріть у лапки, інакше решта рядка стане коментарем
            linked_device: ""  # можна пропустити. імʼя пристрою цього варіанта, якому прапор передається у змінній середовища device_flag_var; на пристрій посилаються за іменем, і воно має належати рівно одному пристрою варіанта (замість імені можна linked_device_id, id має перевагу); типово порожнє
            device_flag_var: ""  # можна пропустити. імʼя змінної середовища з прапором; обовʼязкове разом із linked_device, не збігається з env_vars пристрою чи змінною іншого підзавдання того самого пристрою; типово порожнє
            attachments:  # можна пропустити. файли для учасників; тут потрібне, бо інакше files/notes.txt ні з чим не повʼязаний
              - file: files/notes.txt  # обовʼязкове. шлях до файлу відносно теки завдання; однаковий вміст зберігається один раз
                name: notes.txt  # можна пропустити. імʼя файлу, яке бачать учасники, до 255 символів, без /, \ і керівних символів; типово імʼя самого файлу
            placeholders:  # можна пропустити. заповнювачі для {{key}} в описі, перевіряються за топологією варіанта; тут потрібне, бо опис згадує {{server}}
              - key: server  # обовʼязкове. імʼя, яким опис звертається до заповнювача ({{server}}); не повторюється в підзавданні
                kind: ip  # обовʼязкове. vpn.subnet | internet.subnet | ip | external.link; мережа або пристрій, на які він посилається, мають бути в топології варіанта
                ip_reference: vpn  # обовʼязкове. для kind ip одне з vpn | internet | static (static разом з octets_1to3, наприклад 10.0.0); мережа vpn чи internet має бути увімкнена
                last_octet: 10  # можна пропустити. останній октет адреси, 0–255; типово 0
            hints:  # можна пропустити. підказки, які команда може відкрити, до 10; кількість і рівні однакові в усіх варіантах
              - text: Подивись вихідний код головної сторінки.  # обовʼязкове. текст підказки, непорожній, до 20000 байтів
                level: nudge  # можна пропустити. наскільки підказка допомагає, nudge | direction | steps | near_solution; типово nudge
        topology:  # можна пропустити. лабораторія варіанта; без неї підзавдання не має інфраструктури; тут потрібне, бо адреса пристрою й заповнювач посилаються на мережу vpn
          vpn:  # можна пропустити. мережа VPN, через яку учасник дістається лабораторії; тут потрібне, бо на неї посилаються
            enabled: true  # можна пропустити. true | false, типово false; тут потрібне, бо на мережу посилаються
            dhcp: false  # можна пропустити. true | false, типово false; з true потрібні dhcp_ranges (start і end у межах 2–254, без перетинів)
          internet:  # можна пропустити. вихід лабораторії в інтернет; типово вимкнений
            enabled: false  # можна пропустити. true | false, типово false
          devices:  # можна пропустити. пристрої лабораторії; тут потрібне, бо на web посилається зʼєднання
            - name: web  # обовʼязкове. імʼя пристрою, унікальне у варіанті; для container малі латинські літери, цифри й дефіс (не на краях), до 35 символів. На пристрій посилаються за іменем (linked_device, device у зʼєднанні)
              type: container  # обовʼязкове. container | unmanaged-switch | hub; комутатор і концентратор не мають image, interfaces, env_vars, external, security_preset, resource_preset
              image: nginx:1.27  # можна пропустити. публічний образ контейнера; імпорт його не перевіряє, але без образу контейнеру нічого запускати. Форма image: {file: images/<назва>.tar} (образ в архіві) зʼявиться пізніше, зараз імпорт її відхиляє
              resource_preset: micro  # можна пропустити. пресет ресурсів платформи; типово nano, micro, small, standard, medium, large, а xlarge і max лише зі схваленим підвищенням; порожнє означає типовий пресет платформи (micro). Імпорт назву не перевіряє, публікація нової версії перевіряє
              security_preset: basic  # можна пропустити. набір можливостей контейнера, basic | service | net | debug; типово basic
              interfaces:  # можна пропустити. мережеві інтерфейси контейнера; тут потрібне, бо на eth0 посилається зʼєднання
                - name: eth0  # обовʼязкове. імʼя інтерфейсу, непорожнє
                  ip:  # обовʼязкове. як інтерфейс отримує адресу
                    type: static  # обовʼязкове. static | dhcp | dhcp-preset | none; static має address_ref або рівно одну адресу в addresses (CIDR)
                    address_ref:  # обовʼязкове. для static без addresses: адреса з мережі лабораторії
                      network: vpn  # обовʼязкове. vpn | internet; мережа має бути увімкнена й досяжна з інтерфейсу через зʼєднання
                      host: 10  # обовʼязкове. останній октет адреси, 2–254, не повторюється у варіанті
          connections:  # можна пропустити. кабелі між пристроями й мережами; тут потрібне, бо без нього адреса з vpn недосяжна
            - endpoints:  # обовʼязкове. рівно два кінці зʼєднання
                - kind: vpn  # обовʼязкове. device | vpn | internet; vpn та internet мають щонайбільше по одному зʼєднанню і мають бути увімкнені
                  interface: eth0  # обовʼязкове. для vpn та internet завжди eth0
                - kind: device  # обовʼязкове. device | vpn | internet
                  device: web  # обовʼязкове. для kind device імʼя пристрою цього варіанта; імʼя має належати рівно одному пристрою (замість імені можна device_id, id має перевагу)
                  interface: eth0  # обовʼязкове. інтерфейс цього пристрою (для комутатора чи концентратора GigabitEthernet0/1–48); кожен інтерфейс лише в одному зʼєднанні
      - linked_to: 1  # обовʼязкове. позиція основного варіанта в списку variants, рахуючи від 1; основний сам не може бути повʼязаним. Повʼязаний варіант успадковує від основного все, крім index, note, а в підзавданнях flag і attachments; інші ключі тут є помилкою: дозволені лише linked_to, id, index, note і tasks з id, flag, attachments
        index: 2  # можна пропустити. номер варіанта для адміністраторів, ціле число; типово 0
        note: Повʼязаний варіант з іншим прапором і файлом.  # можна пропустити. нотатка до варіанта, учасники її не бачать
        tasks:  # можна пропустити. власні частини підзавдань, стільки ж і в тому самому порядку, що в основному; без нього підзавдання не мають flag і attachments; тут потрібне, бо опубліковане підзавдання без linked_device потребує flag
          - flag: ["ICE{example_flag_2}"]  # обовʼязкове. як flag основного варіанта; в основному варіанті й повʼязаних із ним одне підзавдання не може мати однакове значення двічі (перевіряється під час публікації, а ця версія published)
            attachments:  # можна пропустити. власні файли підзавдання в цьому варіанті; тут потрібне, бо інакше files/notes-2.txt ні з чим не повʼязаний
              - file: files/notes-2.txt  # обовʼязкове. шлях до файлу відносно теки завдання
                name: notes.txt  # можна пропустити. імʼя, яке бачать учасники; типово імʼя самого файлу
