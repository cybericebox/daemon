          visual_render: null  # можна пропустити. розташування пристроїв на схемі редактора, обʼєкт у форматі редактора; імпорт його не перевіряє; типово null (немає)
      - linked_to: 1  # обовʼязкове. позиція основного варіанта в списку variants, рахуючи від 1; основний сам не може бути повʼязаним. Повʼязаний варіант успадковує від основного все, крім index, note, weight, device_images, а в підзавданнях flag і attachments; інші ключі тут є помилкою: дозволені лише linked_to, id, index, note, weight, device_images і tasks з id, flag, attachments
        index: 2  # можна пропустити. номер варіанта для адміністраторів, ціле число; типово 0
        note: Повʼязаний варіант з іншим прапором і файлом.  # можна пропустити. нотатка до варіанта, під час розвʼязання не показується
        device_images:  # можна пропустити. власні образи повʼязаного варіанта для пристроїв основного: імʼя пристрою основного варіанта → образ; решта пристрою (імʼя, мережа, змінні) лишається від основного, тож заповнювачі в описах не змінюються; лише для container; типово порожньо
          # db: {file: images/db-2.tar}  — образ, покладений в архів, як image пристрою
          db: redis:7.4  # можна пропустити. образ для пристрою db основного варіанта: рядок-посилання на образ або {file: images/<назва>.tar}; імʼя має належати рівно одному пристрою основного варіанта; у published посилання перевіряється
        tasks:  # можна пропустити. підзавдання варіанта, у всіх варіантах версії однакові за кількістю й порядком; тут потрібне, бо повʼязаний варіант нижче має одне підзавдання
          - flag: ["ICE{example_flag_2}"]  # обовʼязкове. список значень ICE{...}: усередині щонайменше один символ, без пробілів, керувальних символів, { і }; значення не повторюються. Без linked_device рівно одне значення; з linked_device можна кілька (учасник отримає одне), шаблон template:ICE{...} або пропустити ключ (прапор згенерується). У YAML значення з « #» (пробіл перед #) беріть у лапки, інакше решта рядка стане коментарем
            attachments:  # можна пропустити. файли для учасників; тут потрібне, бо інакше files/notes.txt ні з чим не повʼязаний
              - file: files/notes-2.txt  # обовʼязкове. шлях до файлу відносно теки завдання; однаковий вміст зберігається один раз
                name: notes.txt  # можна пропустити. імʼя файлу, яке бачать учасники, до 255 символів, без /, \ і керувальних символів; типово імʼя самого файлу
          - flag: ['template:ICE{\d\d[A-C]}']  # можна пропустити. як flag основного варіанта; без ключа прапор генерується випадково й передається пристрою; значення в основному й повʼязаних варіантах не повторюються
