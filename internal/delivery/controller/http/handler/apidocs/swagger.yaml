      consumes:
      - application/json
      parameters:
      - description: proposal ID
        in: path
        name: proposalID
        required: true
        type: string
      - description: note
        in: body
        name: body
        schema:
          $ref: '#/definitions/exercise.rejectProposalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/exercise.proposalResponse'
              type: object
      summary: Reject a proposal
      tags:
      - exercises
  /exercises/tags:
    get:
      parameters:
      - description: tag prefix (case-insensitive, literal); empty returns the most
          used tags
        in: query
        name: prefix
        type: string
      - description: max tags (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/exercise.ExerciseTagSuggestion'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Existing exercise tags by use (autocomplete and tag filter)
      tags:
      - exercises
  /infrastructure/agents:
    get:
      description: 'The enrolled agents (Source admin: added in the admin; env: bootstrapped
        from AGENT_ENDPOINT and the enrollment token), with live state, held lab groups,
        capacity and the certificate expiry. Requires infrastructure.read (super_admin
        only).'
      parameters:
      - description: 1 also lists deleted (archived) agents
        in: query
        name: archived
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentsResponse'
              type: object
      summary: List infrastructure agents
      tags:
      - infrastructure
    post:
      consumes:
      - application/json
      description: 'Enrolls the agent with the one-time token: the platform generates
        its mutual-TLS key and the signing key pair of the lab access tokens, the
        agent signs the client certificate (the tenant is its CN) and trusts the access
        public key. Both private keys are stored encrypted. 400 (21414) when the agent
        rejects the token (used, expired, unknown), 409 (41413) when the endpoint
        is already added. Requires infrastructure.write (super_admin only).'
      parameters:
      - description: agent
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infrastructure.enrollAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentAdminResponse'
              type: object
      summary: Add (enroll) an infrastructure agent
      tags:
      - infrastructure
  /infrastructure/agents/{agentID}:
    delete:
      description: 'Soft delete: the record stays for history, its keys, certificate
        and endpoint are wiped and its name gets an archive suffix. 409 (71411) while
        the agent holds lab groups; 409 (71416) when future reservations would lose
        capacity and confirm is not 1 (read delete-preview first). The reservations
        stay and become not covered. Requires infrastructure.write (super_admin only).'
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      - description: 1 confirms the consequences listed by delete-preview
        in: query
        name: confirm
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete an infrastructure agent
      tags:
      - infrastructure
    put:
      consumes:
      - application/json
      description: Name, server CA, switch and priority; the endpoint, certificate
        and keys stay. Requires infrastructure.write (super_admin only).
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      - description: agent
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infrastructure.updateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentAdminResponse'
              type: object
      summary: Change an infrastructure agent
      tags:
      - infrastructure
  /infrastructure/agents/{agentID}/check:
    post:
      description: Pings the agent and returns its state. Requires infrastructure.read
        (super_admin only).
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentAdminResponse'
              type: object
      summary: Check an infrastructure agent now
      tags:
      - infrastructure
  /infrastructure/agents/{agentID}/delete-preview:
    get:
      description: The lab groups the agent holds (they block the delete) and the
        future reservations that would lose capacity. Requires infrastructure.read
        (super_admin only).
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.deletePreviewResponse'
              type: object
      summary: What deleting an agent would do
      tags:
      - infrastructure
  /infrastructure/agents/{agentID}/reconnect:
    post:
      consumes:
      - application/json
      description: 'Enrolls the same cluster again with a new one-time token for new
        keys (lost or compromised credentials). The record, priority and lab groups
        stay; the tenant must be the same (409, 71415). It is not a move: a move is
        a delete plus a new enrollment. Requires infrastructure.write (super_admin
        only).'
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      - description: token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infrastructure.reconnectAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentAdminResponse'
              type: object
      summary: Reconnect an agent (re-enroll the same cluster)
      tags:
      - infrastructure
  /infrastructure/agents/{agentID}/renew-certificate:
    post:
      description: Gets a new certificate for a new key over the agent's current connection.
        It is also renewed automatically 10 days before it ends (certificates are
        valid 30 days). The certificate must name the same tenant (409, 71415). Requires
        infrastructure.write (super_admin only).
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentAdminResponse'
              type: object
      summary: Renew an agent's client certificate now
      tags:
      - infrastructure
  /infrastructure/agents/{agentID}/rotate-access-key:
    post:
      description: Generates a new key pair, adds its public key at the agent (both
        keys work during the rotation), signs new tokens with it from now on and removes
        the old key 15 minutes later (after the longest token has expired). Requires
        infrastructure.write (super_admin only).
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.agentAdminResponse'
              type: object
      summary: Rotate an agent's lab access signing key
      tags:
      - infrastructure
  /infrastructure/monitoring/capacity/current:
    get:
      description: Returns the latest cluster-wide allocatable and requested CPU/RAM
        capacity for every connected Laboratory agent. Requires infrastructure.read
        (super_admin only).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
