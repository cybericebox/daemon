  /events/{id}/manage/analytics/integrity:
    get:
      description: '§6.6 «Доброчесність». A solve (or a task, for cross_flag) is flagged
        by signals computed on read: cross_flag (the team submitted another team''s
        flag), no_access (no open, download or hint unlock before the flag), no_lab
        (a lab task without any VPN session), too_fast (below the level floor), first_try_hard,
        shared_wrong, burst, brute_force, follows_solve. Most signals first. Hidden
        teams are excluded. Sensitive.'
      parameters:
      - description: event ID
        in: path
        name: id
        required: true
        type: string
      - description: period start (RFC 3339)
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339)
        in: query
        name: to
        type: string
      - description: only solves with this signal
        in: query
        name: signal
        type: string
      - description: only this team
        in: query
        name: teamId
        type: string
      - description: only this task
        in: query
        name: challengeId
        type: string
      - description: yes or no; default both
        in: query
        name: reviewed
        type: string
      - description: shortest plausible time from the first open, seconds (0-3600,
          default 0 = off)
        in: query
        name: floorElementary
        type: integer
      - description: same for trivial (default 5)
        in: query
        name: floorTrivial
        type: integer
      - description: same for easy (default 20)
        in: query
        name: floorEasy
        type: integer
      - description: same for medium (default 60)
        in: query
        name: floorMedium
        type: integer
      - description: same for hard (default 120)
        in: query
        name: floorHard
        type: integer
      - description: same for insane (default 240)
        in: query
        name: floorInsane
        type: integer
      - description: attempts making a brute_force (3-1000, default 15)
        in: query
        name: bruteForceAttempts
        type: integer
      - description: brute_force window, seconds (10-3600, default 60)
        in: query
        name: bruteForceWindow
        type: integer
      - description: follows_solve gap, seconds (5-3600, default 60)
        in: query
        name: followGap
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/eventAnalytics.integrityResponse'
              type: object
      summary: Flagged solves to review (no IP, no automatic action)
      tags:
      - event-analytics
