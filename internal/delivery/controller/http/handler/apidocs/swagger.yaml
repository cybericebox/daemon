      tags:
      - infrastructure
  /infrastructure/stands/{eventID}/{teamID}/challenges/{challengeID}/devices/{device}/reset:
    post:
      description: Discards the device's snapshots and restarts it from the image.
        409 (71405) when the device keeps no state, 404 (31406) when the Lab or device
        is not there, 503 (71407) while it is still being restarted. Requires infrastructure.write
        (super_admin only).
      parameters:
      - description: event ID
        in: path
        name: eventID
        required: true
        type: string
      - description: team ID
        in: path
        name: teamID
        required: true
        type: string
      - description: event challenge ID
        in: path
        name: challengeID
        required: true
        type: string
      - description: device name
        in: path
        name: device
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Reset one device of any stand Lab to its base image
      tags:
      - infrastructure
  /infrastructure/stands/{eventID}/{teamID}/detail:
    get:
      description: 'Per-lab live state of a stand: launch queue (Phase Queued), devices
