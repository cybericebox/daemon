      description: Enable=true starts the device from its latest snapshot with a shell
        instead of the image entrypoint; Enable=false returns it to the normal start.
        Errors as for reset. Requires infrastructure.write (super_admin only).
      parameters:
      - description: event ID
        in: path
        name: eventID
        required: true
        type: string
      - description: team ID
        in: path
        name: teamID
        required: true
        type: string
      - description: event challenge ID
        in: path
        name: challengeID
        required: true
        type: string
      - description: device name
        in: path
        name: device
        required: true
        type: string
      - description: rescue switch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infrastructure.rescueDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
