    get:
      description: Load GET /events/{id}/results first. Send its Revision in Last-Event-ID
        (or the lastEventId query parameter, for EventSource) when opening this stream.
        After any interruption, load a fresh snapshot before reconnecting. A frozen
        viewer does not receive other teams' solves after the freeze; a change of
        the viewer's freeze state ends the stream with snapshot-required.
      parameters:
      - description: event ID
        in: path
        name: id
        required: true
        type: string
      - description: Revision from a newly loaded results snapshot
        in: header
        name: Last-Event-ID
        type: string
      - description: Revision, when the header cannot be set
        in: query
        name: lastEventId
        type: integer
      - description: live = the live screen (event managers only, 403 61218)
        in: query
        name: view
        type: string
      - description: Database polling interval in seconds (2-30, default 2)
        in: query
        name: pollInterval
