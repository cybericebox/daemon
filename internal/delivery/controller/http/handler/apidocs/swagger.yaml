  test.testSendRequest:
    properties:
      Channels:
        items:
          type: string
        type: array
      TemplateID:
        type: string
      Type:
        type: string
      Variables:
        additionalProperties: {}
        type: object
    type: object
  user.dayCountResponse:
    properties:
      Count:
        type: integer
      Day:
        type: string
    type: object
  user.inviteEntryRequest:
    properties:
      Email:
        type: string
      FirstName:
        type: string
      LastName:
        type: string
      Role:
        $ref: '#/definitions/rbac.Role'
    type: object
  user.inviteRequest:
    properties:
      Email:
        type: string
      Emails:
        items:
          type: string
        type: array
      Entries:
        description: 'Entries: one line per person with its own role (empty = user).'
        items:
          $ref: '#/definitions/user.inviteEntryRequest'
        type: array
      FirstName:
        type: string
      LastName:
        type: string
      Role:
        $ref: '#/definitions/rbac.Role'
    type: object
  user.inviteResultResponse:
    properties:
      Code:
        type: string
      Email:
        type: string
      Error:
        type: string
      Role:
        allOf:
        - $ref: '#/definitions/rbac.Role'
        description: 'Role and Code are set for Entries: Code is empty on success.'
    type: object
  user.roleCountResponse:
    properties:
      Count:
        type: integer
      Role:
        $ref: '#/definitions/rbac.Role'
    type: object
  user.updateRoleRequest:
    properties:
      Role:
        $ref: '#/definitions/rbac.Role'
    type: object
  user.updateStatusRequest:
    properties:
      Status:
        $ref: '#/definitions/userModel.UserStatus'
    type: object
  user.userDetailResponse:
    properties:
      CreatedAt:
        type: string
      Email:
        type: string
      EmailConfirmed:
        type: boolean
      FirstName:
        type: string
      ID:
        type: string
      LastName:
        type: string
      LastSeen:
        type: string
      Picture:
        type: string
      Role:
        $ref: '#/definitions/rbac.Role'
      SignInMethods:
        items:
          type: string
        type: array
      Status:
        $ref: '#/definitions/userModel.UserStatus'
    type: object
  user.userResponse:
    properties:
      CreatedAt:
        type: string
      Email:
        type: string
      FirstName:
        type: string
      ID:
        type: string
      LastName:
        type: string
      LastSeen:
        type: string
      Role:
        $ref: '#/definitions/rbac.Role'
      Status:
        $ref: '#/definitions/userModel.UserStatus'
    type: object
  user.userStatsResponse:
    properties:
      ActiveLast7d:
        type: integer
      AvgDailyActive7d:
        type: number
      Blocked:
        type: integer
      ByRole:
        items:
          $ref: '#/definitions/user.roleCountResponse'
        type: array
      NewLast7d:
        type: integer
      RegistrationsByDay:
        items:
          $ref: '#/definitions/user.dayCountResponse'
        type: array
      Total:
        type: integer
    type: object
  userModel.UserStatus:
    enum:
    - active
    - blocked
    - incomplete
    - deleted
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusBlocked
    - UserStatusIncomplete
    - UserStatusDeleted
info:
  contact: {}
  description: CyberICEBox platform backend API.
  title: CyberICEBox API
  version: "1.0"
paths:
  /analytics/events:
    get:
      description: Events created and started and registrations per day of the period,
        events by lifecycle status, the newest events of the period with participants,
        teams, solves, completion rate and duration (at most EventsLimit; EventsTotal
        is the full count), and the next scheduled events. Aggregates only, the moderators
        team is not counted.
      parameters:
      - description: period start (RFC 3339); omitted means all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); omitted means now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/platformAnalytics.eventsResponse'
              type: object
      summary: 'Platform analytics: events'
      tags:
      - platform-analytics
  /analytics/events/export.csv:
    get:
      description: table=events (the per-event table), table=series (per day) or table=upcoming
        (next scheduled events).
      parameters:
      - description: events, series or upcoming
        in: query
        name: table
        required: true
        type: string
      - description: period start (RFC 3339); omitted means all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); omitted means now
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
      summary: Export a table of the events analytics as CSV (UTF-8 with BOM)
      tags:
      - platform-analytics
  /analytics/infrastructure:
    get:
      description: Stand-hours per event and by lab kind (event teams, the moderators
        team, catalog test labs), peaks of concurrently active stands and test labs
        (per hour up to 14 days, else per day), failures by reason code and the cluster
        capacity over time. A stand is active while creating or ready; a test lab
        from its creation to its removal. Stands, TotalHours and Peaks count team
        stands only; test labs are reported next to them. Failures of test labs are
        not recorded. Aggregates only.
      parameters:
      - description: period start (RFC 3339); absent = all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); absent = now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/platformAnalytics.infrastructureResponse'
              type: object
      summary: 'Platform analytics: infrastructure'
      tags:
      - platform-analytics
  /analytics/infrastructure/export.csv:
    get:
      parameters:
      - description: stand_hours | kinds | failures | capacity | peaks
        in: query
        name: table
        required: true
        type: string
      - description: period start (RFC 3339)
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339)
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
      summary: 'Platform analytics: export one infrastructure table as CSV (UTF-8
        with BOM)'
      tags:
      - platform-analytics
  /analytics/mail:
    get:
      description: 'Email and in-app deliveries per day, per channel, per transport
        (email: platform / event / env) and per notification type, the failure rate
        and the top email failure reasons (normalized, never a recipient address).
        Transport and failure reasons are email-only. SMTP test sends are excluded
        unless includeTests is set. The response also lists the values the transport
        and type filters offer.'
      parameters:
      - description: period start (RFC 3339); absent = all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); absent = now
        in: query
        name: to
        type: string
      - description: email | in_app; absent = all
        in: query
        name: channel
        type: string
      - description: platform | event | env | unknown (email only)
        in: query
        name: transport
        type: string
      - description: notification type
        in: query
        name: type
        type: string
      - description: include SMTP test sends (default false)
        in: query
        name: includeTests
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/platformAnalytics.mailResponse'
              type: object
      summary: 'Platform analytics: notification delivery health'
      tags:
      - platform-analytics
  /analytics/mail/export.csv:
    get:
      parameters:
      - description: daily | by_channel | by_transport | by_type | errors
        in: query
        name: table
        required: true
        type: string
      - description: period start (RFC 3339)
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339)
        in: query
        name: to
        type: string
      - description: email | in_app; absent = all
        in: query
        name: channel
        type: string
      - description: platform | event | env | unknown (email only)
        in: query
        name: transport
        type: string
      - description: notification type
        in: query
        name: type
        type: string
      - description: include SMTP test sends (default false)
        in: query
        name: includeTests
        type: boolean
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
      summary: 'Platform analytics: export one mail table as CSV (UTF-8 with BOM)'
      tags:
      - platform-analytics
  /analytics/overview:
    get:
      description: Headline numbers of the platform for the period (users, events
        by status, participants, attempts and solves, emails, stands), each with the
        value of the previous period of the same length (null for all time), and daily
        series of new users, attempts and solves, and emails. from/to are RFC 3339;
        no from means all time.
      parameters:
      - description: period start (RFC 3339); absent = all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); absent = now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/platformAnalytics.overviewResponse'
              type: object
      summary: Platform overview analytics
      tags:
      - platform-analytics
  /analytics/overview/export.csv:
    get:
      description: table is summary (every headline number with the previous period)
        or series (the daily series).
      parameters:
      - description: summary | series
        in: query
        name: table
        required: true
        type: string
      - description: period start (RFC 3339); absent = all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); absent = now
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
      summary: Export one table of the overview analytics as CSV (UTF-8 with BOM)
      tags:
      - platform-analytics
  /analytics/tasks:
    get:
      description: 'Usage and calibration of catalog tasks across the events that
        started in the period: events using each task, attempts, solves, solve rate
        (solvers ÷ teams that tried), median time to solve, hint unlock rate (teams
        that unlocked a hint ÷ teams that opened or tried), the used tasks nobody
        solved, usage by category and solve rate by level. Category is an exercise
        tag, level a task difficulty. The result is bounded (TasksLimit rows; TasksTotal
        is the full count). The moderators team is not counted.'
      parameters:
      - description: period start (RFC 3339); omitted means all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); omitted means now
        in: query
        name: to
        type: string
      - description: exercise tag
        in: query
        name: category
        type: string
      - description: 'difficulty: trivial, easy, medium, hard, insane'
        in: query
        name: level
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/platformAnalytics.tasksResponse'
              type: object
      summary: 'Platform analytics: catalog tasks across events'
      tags:
      - platform-analytics
  /analytics/tasks/export.csv:
    get:
      description: table=tasks (usage and calibration) or table=unsolved (used tasks
        nobody solved). The category and level filters apply.
      parameters:
      - description: tasks or unsolved
        in: query
        name: table
        required: true
        type: string
      - description: period start (RFC 3339); omitted means all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); omitted means now
        in: query
        name: to
        type: string
      - description: exercise tag
        in: query
        name: category
        type: string
      - description: 'difficulty: trivial, easy, medium, hard, insane'
        in: query
        name: level
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
      summary: Export a table of the catalog task analytics as CSV (UTF-8 with BOM)
      tags:
      - platform-analytics
  /analytics/users:
    get:
      description: Aggregates of the admin user stats bound to the period (total,
        blocked, by role, new and active accounts, registrations per day) plus daily
        and weekly active accounts, the sign-in method split (password, Google, both,
        none) and how many events accounts joined (1, 2, 3+). Aggregates only; per-user
        rows are at /analytics/users/people. from/to are RFC 3339; no from means all
        time.
      parameters:
      - description: period start (RFC 3339); absent = all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); absent = now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/platformAnalytics.usersResponse'
              type: object
      summary: Platform users analytics
      tags:
      - platform-analytics
  /analytics/users/export.csv:
    get:
      description: 'table is registrations, activity, methods, retention, or people
        (per-user rows: requires analytics.users.read).'
      parameters:
      - description: registrations | activity | methods | retention | people
        in: query
        name: table
        required: true
        type: string
      - description: period start (RFC 3339); absent = all time
        in: query
        name: from
        type: string
      - description: period end, exclusive (RFC 3339); absent = now
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
      summary: Export one table of the users analytics as CSV (UTF-8 with BOM)
      tags:
      - platform-analytics
  /analytics/users/people:
    get:
      description: 'Up to 100 accounts with the most events joined (name, email, role,
        events joined, solves). Personal data: requires analytics.users.read (super_admin).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/platformAnalytics.usersPersonResponse'
                  type: array
              type: object
      summary: The most active users (per-user rows)
      tags:
      - platform-analytics
  /auth/account:
    delete:
      consumes:
      - application/json
      parameters:
      - description: current password (accounts without a password need a recent sign-in
          instead)
        in: body
        name: body
        schema:
          $ref: '#/definitions/auth.reauthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete (soft-delete) the authenticated user's account
      tags:
      - auth
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.accountResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get the authenticated user's account details
      tags:
      - auth
  /auth/account/avatar:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Remove the authenticated user's avatar
      tags:
      - auth
    post:
      consumes:
      - multipart/form-data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Upload the authenticated user's avatar (multipart "file")
      tags:
      - auth
  /auth/account/email:
    post:
      consumes:
      - application/json
      parameters:
      - description: new email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.requestEmailChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Request an email address change (sends confirmation to the new address)
      tags:
      - auth
  /auth/account/email/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: confirmation code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.confirmEmailChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Confirm an email address change using the code sent to the new address
      tags:
      - auth
  /auth/account/profile:
    patch:
      consumes:
      - application/json
      parameters:
      - description: profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update the authenticated user's profile (first name, last name)
      tags:
      - auth
  /auth/avatar/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: Stream a user's avatar from storage (public proxy)
      tags:
      - auth
  /auth/google:
    get:
      parameters:
      - description: post-auth landing URL
        in: query
        name: return_to
        type: string
      responses:
        "307":
          description: Temporary Redirect
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Begin Google sign-in (redirects to Google OAuth)
      tags:
      - auth
  /auth/google/callback:
    get:
      parameters:
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "307":
          description: Temporary Redirect
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Google OAuth callback — dispatches by intent cookie (sign-in / register
        / setup)
      tags:
      - auth
  /auth/google/link:
    delete:
      consumes:
      - application/json
      parameters:
      - description: current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.reauthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Unlink Google from the authenticated user's account
      tags:
      - auth
    get:
      responses:
        "307":
          description: Temporary Redirect
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Begin linking Google to the authenticated account (redirects to Google
        OAuth)
      tags:
      - auth
  /auth/google/register:
    get:
      parameters:
      - description: post-registration landing URL (kept on /setup)
        in: query
        name: return_to
        type: string
      responses:
        "307":
          description: Temporary Redirect
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Begin Google registration (sets register intent cookie, redirects to
        Google OAuth)
      tags:
      - auth
  /auth/google/setup:
    get:
      parameters:
      - description: setup token
        in: query
        name: token
        required: true
        type: string
      - description: post-registration landing URL (kept on /setup)
        in: query
        name: return_to
        type: string
      responses:
        "307":
          description: Temporary Redirect
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Link Google to an incomplete (setup) account
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get the authenticated user's public profile
      tags:
      - auth
  /auth/password/change:
    post:
      consumes:
      - application/json
      parameters:
      - description: old + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Change the authenticated user's password
      tags:
      - auth
  /auth/password/policy:
    get:
      description: Public. Thresholds are static (server config); clients use them
        to validate passwords before submitting.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.passwordPolicyResponse'
              type: object
      summary: Get the active password complexity policy
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      parameters:
      - description: code + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Reset password with a reset code
      tags:
      - auth
  /auth/password/reset-request:
    post:
