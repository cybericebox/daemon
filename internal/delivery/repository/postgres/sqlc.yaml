version: 2
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: postgres
        out: "."
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            engine: "postgresql"
            go_type:
              import: "github.com/gofrs/uuid"
              type: "UUID"
          - db_type: "uuid"
            engine: "postgresql"
            nullable: true
            go_type:
              import: "github.com/gofrs/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            engine: "postgresql"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "float8"
            engine: "postgresql"
            go_type: "float64"
          - column: "events_metadata.data"
            go_type:
              import: "github.com/cybericebox/daemon/internal/model/event"
              type: "EventMetadata"
              package: "eventModel"
          - column: "event_team_challenges.snapshot"
            go_type:
              import: "github.com/cybericebox/daemon/internal/model/event"
              type: "ChallengeSnapshot"
              package: "eventModel"
          - column: "event_challenges.prerequisites"
            go_type:
              import: "github.com/gofrs/uuid"
              type: "UUID"
              slice: true
