name: Test

# The tests of the repository: the PR check and the pre-release run them (workflow_call).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # No sibling checkout: verify the scoped SDK before an independent build.
      - name: Laboratory SDK source provenance
        run: python3 .github/scripts/check-laboratory-sdk.py
      - name: Build
        run: make build
      - name: Vet
        run: make vet
      - name: Login to Docker Hub for container tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Test
        run: make test
