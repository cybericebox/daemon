name: Develop image

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  image:
    name: cybericebox/daemon
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4
      # The backend imports the laboratory agent contract through a Go-module replacement; the Dockerfile takes it
      # as the named build context "laboratory". Set LABORATORY_CHECKOUT_TOKEN when that repository is private.
      - name: Check laboratory
        uses: actions/checkout@v4
        with:
          repository: cybericebox/laboratory
          ref: develop
          path: laboratory
          token: ${{ secrets.LABORATORY_CHECKOUT_TOKEN || github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          echo "sha=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: laboratory=./laboratory
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            cybericebox/daemon:develop
            cybericebox/daemon:${{ steps.meta.outputs.sha }}
