name: Release image

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (vX.Y.Z), also tagged latest
        required: true
      laboratory_ref:
        description: Ref of cybericebox/laboratory to build against
        required: false
        default: develop

jobs:
  image:
    name: cybericebox/daemon
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4
      - name: Check laboratory
        uses: actions/checkout@v4
        with:
          repository: cybericebox/laboratory
          ref: ${{ inputs.laboratory_ref || 'develop' }}
          path: laboratory
          token: ${{ secrets.LABORATORY_CHECKOUT_TOKEN || github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Version
        id: meta
        run: |
          version="${{ inputs.version || github.ref_name }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: laboratory=./laboratory
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            cybericebox/daemon:${{ steps.meta.outputs.version }}
            cybericebox/daemon:latest
